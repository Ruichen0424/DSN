# Dataset / Model parameters
data_dir: /ssd/Datasets/ImageNet/
dataset: imagenet
num_classes: 1000
img_size: 224
mean:
    - 0.485
    - 0.456
    - 0.406
std:
    - 0.229
    - 0.224
    - 0.225
crop_pct: 0.95
interpolation: bicubic
train_interpolation: bicubic
timestep: 4

# Augmentation & regularization parameters
aa: rand-m7-mstd0.5-inc1
mixup: 0
mixup_off_epoch: 0
mixup_prob: 0.6
mixup_mode: batch
mixup_switch_prob: 0.5
cutmix: 0
remode: const

# Misc
amp: True
batch_size: 64
val_batch_size: 64
lr: 0.05
min_lr: 5e-5
sched: cosine
weight_decay: 2e-5
epochs: 150
cooldown_epochs: 5
warmup_epochs: 10
warmup_lr: 5e-3
opt: sgd
smoothing: 0.1
workers: 16
dist_bn: ''
log_interval: 400

seed: 2025
experiment: imagenet_ms34_D
model: msnet34