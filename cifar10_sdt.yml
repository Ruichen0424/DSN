# Dataset / Model parameters
data_dir: /ssd/Datasets/CIFAR10/
dataset: cifar10
num_classes: 10
num_heads: 8
img_size: 32
mean:
    - 0.4914
    - 0.4822
    - 0.4465
std:
    - 0.2470
    - 0.2435
    - 0.2616
crop_pct: 1.0
scale:
    - 1.0
    - 1.0
ratio: [1.0, 1.0]
interpolation: bicubic
train_interpolation: bicubic
timestep: 4
depths: 2
dim: 512

# Augmentation & regularization parameters
aa: rand-m9-n1-mstd0.4-inc1
color_jitter: 0.5
mixup: 0.5
mixup_off_epoch: 200
mixup_prob: 1.0
mixup_mode: batch
mixup_switch_prob: 0.5
cutmix: 0.0

# Misc
amp: True
batch_size: 64
val_batch_size: 64
lr: 3e-4
min_lr: 1e-5
sched: cosine
weight_decay: 6e-2
epochs: 300
cooldown_epochs: 10
warmup_epochs: 20
warmup_lr: 1e-6
opt: adamw
smoothing: 0.1
workers: 8

seed: 2025
experiment: cifar10_sdt_2_512_D
model: spikedriventransformer